name: CI/CD

on:
  # Runs on PRs to main and on pushes (merge) to main
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Minimal permissions + permission to publish packages to GHCR
permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_and_test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      # Checkout code
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Set up Node.js with npm cache
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci || npm install

      # Run linting
      - name: Run ESLint
        run: npm run lint --if-present || echo "No lint script found"

      # Run tests if available
      - name: Run tests
        run: npm test --if-present || echo "No test script found"

  build_and_publish:
    name: Build, Docker and Deploy
    runs-on: ubuntu-latest
    needs: lint_and_test
    if: ${{ needs.lint_and_test.result == 'success' }}
    env:
      APP_NAME: espacogeek-frontend

    steps:
      # Checkout code (with full history for versioning)
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Normalize owner/repo to lowercase (GHCR requirement)
      - name: Normalize GHCR owner/repo
        shell: bash
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          REPO_LC="${GITHUB_REPOSITORY#*/}"
          REPO_LC="${REPO_LC,,}"
          echo "GHCR_OWNER_LC=${OWNER_LC}" >> "$GITHUB_ENV"
          echo "GHCR_REPO_LC=${REPO_LC}" >> "$GITHUB_ENV"

      # Set up Node.js with npm cache
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci || npm install

      # Read version from package.json
      - name: Read package version
        id: package_version
        shell: bash
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Build React app for production
      - name: Build React app
        run: npm run build

      # Generate version tags for Docker images
      # - On PR: pr-<number>-<short-sha>, v<version>-pr-<number>
      # - On push to main: latest, sha-<short-sha>, <yyyyMMdd>, v<version>
      - name: Compute version tags
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          DATE_TAG="$(date +%Y%m%d)"
          VERSION="${{ steps.package_version.outputs.version }}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            TAGS="pr-${PR_NUMBER}-${SHORT_SHA},v${VERSION}-pr-${PR_NUMBER}"
            SHOULD_PUSH="false"
          else
            # push to main
            TAGS="latest,last-release,sha-${SHORT_SHA},${DATE_TAG},v${VERSION}"
            SHOULD_PUSH="true"
          fi
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "date_tag=${DATE_TAG}" >> "$GITHUB_OUTPUT"
          echo "tags_csv=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "should_push=${SHOULD_PUSH}" >> "$GITHUB_OUTPUT"

      # Set up Docker Buildx and layer cache
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GHCR (uses GITHUB_TOKEN)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Prepare tag list for docker/buildx
      - name: Prepare tag list (multiline)
        id: tags
        shell: bash
        run: |
          IFS=',' read -ra T <<< "${{ steps.vars.outputs.tags_csv }}"
          printf "frontend_tags<<EOF\n" >> "$GITHUB_OUTPUT"
          for tag in "${T[@]}"; do
            echo "ghcr.io/${{ env.GHCR_OWNER_LC }}/${{ env.APP_NAME }}:$tag" >> "$GITHUB_OUTPUT"
          done
          printf "EOF\n" >> "$GITHUB_OUTPUT"

      # Build and push Docker image (Nginx)
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ steps.vars.outputs.should_push == 'true' && github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.frontend_tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.package_version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.short_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy to Hostinger via SSH
      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v0.1.9
        if: ${{ needs.lint_and_test.result == 'success' && steps.vars.outputs.should_push == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          envs: GHCR_OWNER_LC,APP_NAME
          script_stop: false
          script: |
            # Trap for SSH-level cleanup
            cleanup_on_exit() {
              echo "Running SSH-level cleanup..."
              docker logout ghcr.io 2>/dev/null || true
            }
            trap cleanup_on_exit EXIT INT TERM

            # Define deploy script path
            DEPLOY_SCRIPT="/opt/espacogeek/deploy-frontend.sh"

            # Create directory if doesn't exist
            mkdir -p "$(dirname "$DEPLOY_SCRIPT")"

            # Download deploy script from repository
            # Using curl to fetch the script from GitHub raw content
            if ! curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/${{ github.ref_name }}/deploy-frontend.sh" -o "$DEPLOY_SCRIPT"; then
              echo "[ERROR] Failed to download deploy script"
              exit 1
            fi

            # Make script executable
            chmod +x "$DEPLOY_SCRIPT"

            # Login to GHCR
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            # Execute deployment script
            "$DEPLOY_SCRIPT" "${GHCR_OWNER_LC}" "${APP_NAME}" "latest"

      # Final summary
      - name: Summary
        if: always()
        run: |
          echo "Package version: ${{ steps.package_version.outputs.version }}"
          echo "Tags generated: ${{ steps.vars.outputs.tags_csv }}"
          echo "Push enabled: ${{ steps.vars.outputs.should_push }}"
